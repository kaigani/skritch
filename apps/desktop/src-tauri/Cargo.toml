[package]
name = "skritch"
version = "0.2.0"
description = "Skritch — screenshot, markup and video trim"
authors = ["Skritch"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "skritch_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-drag = "2"
drag = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9"
arboard = { version = "3", default-features = false, features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff"] }
percent-encoding = "2"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std", "objc2-core-foundation", "NSButton", "NSControl", "NSDragging", "NSGraphics", "NSPasteboard",
  "NSPageLayout", "NSPrintInfo", "NSPasteboardItem", "NSResponder", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWindow",
] }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Dependencies (image/PNG, xcap, ...) are compiled with optimisations even in dev builds: an
# unoptimised PNG encode of a Retina screenshot takes several seconds and made `pnpm tauri dev`
# capture latency unrepresentative. Our own crate stays at opt-level 0 for fast rebuilds.
[profile.dev.package."*"]
opt-level = 3
